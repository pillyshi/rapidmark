[project]
name = "rapidmark"
version = "0.5.2"
description = "Fast and efficient NLP annotation tool for text labeling tasks"
authors = [{ name = "pillyshi" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16.0,<0.17.0",
    "rich>=14.0.0,<15.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "jsonschema>=4.24.0,<5.0.0",
    "pydantic>=2.11.5,<3.0.0",
]

[project.scripts]
rapidmark = "rapidmark.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.0.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rapidmark"]
include = ["rapidmark/generator/**/*", "rapidmark/generator/**/.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
